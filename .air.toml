root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -ldflags '-s -w' -o ./tmp/nowen-video ./cmd/server"
  bin = "./tmp/nowen-video"
  full_bin = "./tmp/nowen-video"
  include_ext = ["go", "yaml", "yml"]
  exclude_dir = ["tmp", "web/node_modules", "web/dist", "data", "cache", "config"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = 500

[log]
  time = true

[misc]
  clean_on_exit = true

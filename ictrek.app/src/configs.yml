configs:
  - name: NOWEN_WORKSPACE_PATH
    type: path
    title:
      zh-CN: Nowen Video 存储根目录
      en: Nowen Video Storage Root
    description:
      zh-CN: Nowen Video 的统一存储根目录；可使用默认宿主机路径，也可选择 VOS 公共目录。data、cache 和 media 子目录由应用模板自动管理。
      en: Unified storage root for Nowen Video. Use the default host path or select a VOS public directory; the app template manages the data, cache, and media subdirectories.
    default: /data/vos_workspace/nowen_video
    hints: [com.ictrek.media.storage]

  # NOWEN_APP_WEB_BASE_PATH 不暴露为 VOS 可配置项：VOS 下挂载前缀由
  # traefik.yml / manifest.yml / routers.yml 三重锁死为 /app/com.ictrek.nowen-video，
  # 用户改动必与路由失配导致白屏；compose 内 ${NOWEN_APP_WEB_BASE_PATH:-...} 默认值兜底，
  # 独立部署走 config.yaml 的 web_base_path。

  - name: NOWEN_PORT
    type: integer
    title:
      zh-CN: 应用宿主端口
      en: App Host Port
    description:
      zh-CN: "容器 8080 映射到宿主的端口，Traefik 经 172.17.0.1 转发到此端口。注意：改端口需同步修改应用包内的 traefik.yml（file provider 不支持变量插值）。"
      en: "Host port mapped from container 8080; Traefik forwards via 172.17.0.1. Note: changing this requires editing traefik.yml in the package (file provider has no interpolation)."
    default: 38085
    minimum: 1024
    maximum: 65535

  # ---- PostgreSQL（应用为 PostgreSQL-only，连接 VOS 共享 PGV）----
  # 默认连接 PGV（vos_default 网络别名 pgv:5432），库/用户/扩展已由 PGV provision 预置；
  # 填写任意一项即覆盖对应值（指向其他库时需自备 pgvector 扩展）。
  - name: NOWEN_DATABASE_HOST
    type: string
    title:
      zh-CN: 数据库主机
      en: Database Host
    description:
      zh-CN: PostgreSQL 主机。默认 pgv 指向 VOS 共享 PGV 服务；如用独立库请填写其地址。
      en: PostgreSQL host. Default 'pgv' points to the shared PGV service; fill in for a standalone DB.
    default: pgv

  - name: NOWEN_DATABASE_PORT
    type: integer
    title:
      zh-CN: 数据库端口
      en: Database Port
    description:
      zh-CN: PostgreSQL 端口。
      en: PostgreSQL port.
    default: 5432
    minimum: 1
    maximum: 65535

  - name: NOWEN_DATABASE_USER
    type: string
    title:
      zh-CN: 数据库用户
      en: Database User
    description:
      zh-CN: PostgreSQL 用户（PGV 预置为 nowen）。
      en: PostgreSQL user (provisioned by PGV as 'nowen').
    default: nowen

  - name: NOWEN_DATABASE_PASSWORD
    type: string
    title:
      zh-CN: 数据库密码
      en: Database Password
    description:
      zh-CN: PostgreSQL 密码（PGV 预置为 nowen_password）。
      en: PostgreSQL password (provisioned by PGV as 'nowen_password').
    default: nowen_password

  - name: NOWEN_DATABASE_DBNAME
    type: string
    title:
      zh-CN: 数据库名
      en: Database Name
    description:
      zh-CN: PostgreSQL 数据库名（PGV 预置为 nowen_video，含 pgvector 扩展）。
      en: PostgreSQL database name (provisioned by PGV as 'nowen_video', with pgvector extension).
    default: nowen_video

  - name: NOWEN_LOGGING_LEVEL
    type: string
    title:
      zh-CN: 日志级别
      en: Log Level
    description:
      zh-CN: Nowen Video 服务日志级别。
      en: Log level for the Nowen Video service.
    default: info
    enum: [debug, info, warn, error]

  # ---- Embedding 向量检索（依赖独立部署的 emb_server）----
  # 地址即开关：默认连宿主 emb_server（http://172.17.0.1:18005），改地址即改
  # 连接目标；留空则禁用（视频分析不受影响，只是不计算场景向量）。
  - name: NOWEN_AI_EMBEDDING_AI_API_BASE
    type: string
    title:
      zh-CN: Embedding 服务地址
      en: Embedding Server URL
    description:
      zh-CN: emb_server 服务地址。默认 http://172.17.0.1:18005（VOS 主机同机部署）；留空禁用场景向量检索。
      en: emb_server base URL. Default http://172.17.0.1:18005 (same-host deployment); leave empty to disable scene vector search.
    default: http://172.17.0.1:18005

  # ---- 视频分析 Scene（detect）/ Structure 外部服务地址 ----
  # 仅作为安装初始值；运行期修改请到 Nowen 管理后台「视频分析设置」。
  - name: NOWEN_VIDEO_ANALYSIS_SCENE_BASE_URL
    type: string
    title:
      zh-CN: 视频分析 Scene 服务地址
      en: Scene Detection Service URL
    description:
      zh-CN: 场景检测（detect）服务地址。默认 http://172.17.0.1:48910（VOS 主机同机部署）；仅作为安装初始值，运行期请到 Nowen 管理后台「视频分析设置」修改。
      en: Scene detection service base URL. Default http://172.17.0.1:48910 (same-host deployment); initial value only, change it at runtime in Nowen video-analysis settings.
    default: http://172.17.0.1:48910

  - name: NOWEN_VIDEO_ANALYSIS_STRUCTURE_BASE_URL
    type: string
    title:
      zh-CN: 视频分析 Structure 服务地址
      en: Video Structure Service URL
    description:
      zh-CN: 视频结构化（structure）服务地址。默认 http://172.17.0.1:48911（VOS 主机同机部署）；仅作为安装初始值，运行期请到 Nowen 管理后台「视频分析设置」修改。
      en: Video structure service base URL. Default http://172.17.0.1:48911 (same-host deployment); initial value only, change it at runtime in Nowen video-analysis settings.
    default: http://172.17.0.1:48911

  - name: NOWEN_ADULT_SCRAPER_ENABLED
    type: boolean
    title:
      zh-CN: 启用番号刮削
      en: Enable Adult Scraper
    description:
      zh-CN: 是否启用应用内的可选番号元数据刮削服务。
      en: Enable the optional in-app adult metadata scraper.
    default: false

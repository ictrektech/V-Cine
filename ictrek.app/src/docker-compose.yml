services:
  nowen-video-amd:
    &nowen-video-base
    image: ${NOWEN_VIDEO_AMD_IMAGE}
    restart: unless-stopped
    pull_policy: always
    user: "0:0"
    networks:
      vos_default:
        aliases:
          - nowen-video
    # 不在本 compose 内声明 postgres：复用 VOS 共享 pgv 服务（com.ictrek.pgv），
    # 它在 vos_default 网络里的别名是 pgv，由 pgv app 的 provision 脚本预置
    # nowen role + nowen_video 库 + vector 扩展。pgv 是独立 app、可能晚于 nowen 启动，
    # 因此不写 depends_on：应用连不上库会 fatal 退出、restart 自愈，pgv 就绪后即连上。
    environment:
      NOWEN_APP_PORT: "8080"
      NOWEN_APP_DATA_DIR: /data
      NOWEN_APP_WEB_DIR: /app/web/dist
      # VOS 子路径：服务端据此向 index.html 注入 <base href> 与 window.NOWEN_BASE_PATH 变量，
      # 前端资源/API/WS/路由自动落在 /app/com.ictrek.nowen-video 前缀下（Traefik 再剥回）。
      NOWEN_APP_WEB_BASE_PATH: "${NOWEN_APP_WEB_BASE_PATH:-/app/com.ictrek.nowen-video}"
      # ---- PostgreSQL：连共享 pgv（com.ictrek.pgv 在 vos_default 的别名）----
      NOWEN_DATABASE_HOST: "${NOWEN_DATABASE_HOST:-pgv}"
      NOWEN_DATABASE_PORT: "${NOWEN_DATABASE_PORT:-5432}"
      NOWEN_DATABASE_USER: "${NOWEN_DATABASE_USER:-nowen}"
      NOWEN_DATABASE_PASSWORD: "${NOWEN_DATABASE_PASSWORD:-nowen_password}"
      NOWEN_DATABASE_DBNAME: "${NOWEN_DATABASE_DBNAME:-nowen_video}"
      NOWEN_CACHE_CACHE_DIR: /cache
      NOWEN_LOGGING_LEVEL: "${NOWEN_LOGGING_LEVEL:-info}"
      NOWEN_ADULT_SCRAPER_ENABLED: "${NOWEN_ADULT_SCRAPER_ENABLED:-false}"
      NOWEN_ADULT_SCRAPER_AUTO_START_PYTHON: "true"
      NOWEN_ADULT_SCRAPER_PYTHON_EXECUTABLE: /usr/bin/python3
      NOWEN_ADULT_SCRAPER_PYTHON_SERVICE_DIR: /app/scripts/adult-scraper
      NOWEN_VOS_OIDC_ENABLED: "true"
      NOWEN_VOS_OIDC_JWKS_URL: http://172.17.0.1:8105/v1000/oauth2/jwks
      NOWEN_VOS_OIDC_ISSUER: /v1000/oauth2
      NOWEN_VOS_OIDC_CLIENT_ID: com.ictrek.nowen-video
      # ---- Embedding 向量检索（依赖独立部署的 emb_server，默认连宿主 18005）----
      NOWEN_AI_EMBEDDING_AI_API_BASE: "${NOWEN_AI_EMBEDDING_AI_API_BASE:-http://172.17.0.1:18005}"
      # ---- 视频分析 Scene / Structure 外部服务地址（安装初始值，运行期可在 Nowen 管理后台修改）----
      NOWEN_VIDEO_ANALYSIS_SCENE_BASE_URL: "${NOWEN_VIDEO_ANALYSIS_SCENE_BASE_URL:-http://172.17.0.1:48910}"
      NOWEN_VIDEO_ANALYSIS_STRUCTURE_BASE_URL: "${NOWEN_VIDEO_ANALYSIS_STRUCTURE_BASE_URL:-http://172.17.0.1:48911}"
      TZ: "${TZ:-Asia/Shanghai}"
    # 宿主端口：Traefik file provider 经 docker0 网关 172.17.0.1 转发到该端口
    ports:
      - "${NOWEN_PORT:-38085}:8080"
    volumes:
      - ${NOWEN_WORKSPACE_PATH:-/data/vos_workspace/nowen}/data:/data
      - ${NOWEN_WORKSPACE_PATH:-/data/vos_workspace/nowen}/cache:/cache
      - ${NOWEN_WORKSPACE_PATH:-/data/vos_workspace/nowen}/media:/media
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    profiles: ["amd"]

  nowen-video-arm:
    <<: *nowen-video-base
    image: ${NOWEN_VIDEO_ARM_IMAGE}
    profiles: ["arm"]

  # Jetson / L4T：使用 Dockerfile.l4t 构建的 l4t_${VERSION} 镜像，
  # nvmpi 需要 nvidia runtime + privileged。
  nowen-video-l4t:
    <<: *nowen-video-base
    image: ${NOWEN_VIDEO_L4T_IMAGE}
    runtime: nvidia
    privileged: true
    profiles: ["l4t"]

networks:
  vos_default:
    external: true

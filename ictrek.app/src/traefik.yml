# Traefik File Provider 动态配置 - v-cine 路由
# ============================================================
# VOS 平台 Traefik 只启用 file provider（/etc/traefik/dynamic-conf），
# 不读 docker-compose labels，因此路由必须通过本文件注册
# （平台安装时复制到 dynamic-conf/<app_id>.yml）。
#
# 服务地址走 Docker 默认网桥网关（docker0，172.17.0.1）+ 宿主端口映射：
#   - v-cine 容器 8080 映射到宿主 ${VCINE_PORT:-38085}
# 注意：Traefik file provider 不支持 ${VAR} 环境变量插值。
# 若安装时将 VCINE_PORT 改为非默认值，需同步修改下方 servers.url 端口。
#
# 流量路径：
#   /app/com.ictrek.v-cine/... -> strip /app/... -> 容器根路径
#   前端构建期通过 VITE_BASE 写入前缀，资源/API 再带前缀请求，Traefik 剥回
# ============================================================

http:
  routers:
    # ---- 前端 + API 主路由（剥前缀后转发到容器根路径）----
    v-cine-web:
      rule: "PathPrefix(`/app/com.ictrek.v-cine`)"
      service: v-cine-web
      middlewares:
        - v-cine-web-slash
        - v-cine-web-strip

    # ---- 顶层打开兜底：浏览器地址栏直接访问 /app/com.ictrek.v-cine
    #      重定向到平台 hash 路由（平台前端 iframe 打开应用）----
    v-cine-top-open:
      rule: "PathPrefix(`/app/com.ictrek.v-cine`) && HeadersRegexp(`Sec-Fetch-Dest`, `document`)"
      priority: 1000
      service: v-cine-web
      middlewares:
        - v-cine-top-open-redirect

  services:
    v-cine-web:
      loadBalancer:
        servers:
          - url: "http://172.17.0.1:38085"

  middlewares:
    v-cine-top-open-redirect:
      redirectRegex:
        regex: '^(https?://[^/]+)/app/com\.ictrek\.v-cine/?(?:\?.*)?$'
        replacement: '${1}/#/app/com.ictrek.v-cine/nowen-video'
        permanent: false

    v-cine-web-slash:
      redirectRegex:
        regex: '^(.*)/app/com\.ictrek\.v-cine$'
        replacement: '${1}/app/com.ictrek.v-cine/'
        permanent: true

    v-cine-web-strip:
      stripPrefix:
        prefixes:
          - /app/com.ictrek.v-cine

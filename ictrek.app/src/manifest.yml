id: com.ictrek.nowen-video
name:
  zh-CN: Nowen Video
  en: Nowen Video
description:
  zh-CN: 面向家庭媒体库的自托管影音中心。
  en: A self-hosted home media center.
version: __APP_VERSION__
author: ictrek
category: [media]
arch: [amd64, arm64]

frontend:
  enabled: true
  basePath: /app/com.ictrek.nowen-video

platform:
  version: ">=3.0.0"

storage:
  directories:
    - path: data
      mode: "0755"
    - path: cache
      mode: "0755"
    - path: media
      mode: "0755"

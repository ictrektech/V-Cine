id: com.ictrek.nowen-video
name:
  zh-CN: Nowen Video
  en: Nowen Video
description:
  zh-CN: 面向家庭媒体库的自托管影音中心。
  en: A self-hosted home media center.
version: __APP_VERSION__
author: ictrek
category: [media]
arch: [amd64, arm64]
icon: icon.png

frontend:
  enabled: true
  basePath: /app/com.ictrek.nowen-video

platform:
  version: ">=3.0.0"

oauth2:
  client:
    id: com.ictrek.nowen-video
    client_type: public
    grant_types: [authorization_code, refresh_token]
    response_types: [code]
    scopes: [openid, profile, email]
    pkce_required: true
    token_endpoint_auth_method: none

profiles:
  - name: amd
    title:
      zh-CN: AMD64
      en: AMD64
    description:
      zh-CN: 适用于 AMD64 VOS 主机。
      en: For AMD64 VOS hosts.
    conflicts: [arm, l4t]
  - name: arm
    title:
      zh-CN: ARM64
      en: ARM64
    description:
      zh-CN: 适用于 ARM64 VOS 主机。
      en: For ARM64 VOS hosts.
    conflicts: [amd, l4t]
  - name: l4t
    title:
      zh-CN: Jetson / L4T
      en: Jetson / L4T
    description:
      zh-CN: Jetson / L4T 平台，使用 nvidia runtime 与硬件编解码。
      en: Jetson / L4T platform, uses nvidia runtime and hardware codec.
    conflicts: [amd, arm]

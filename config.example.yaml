# ==================== V-Cine 配置文件 ====================
#
# 配置加载优先级（从低到高）：
#   1. 内置默认值
#   2. 本文件（config.yaml）—— 支持旧版扁平格式和新版嵌套格式
#   3. config/ 目录下的分片配置文件（database.yaml, secrets.yaml 等）
#   4. 环境变量（VCINE_ 前缀，如 VCINE_APP_PORT=8080）
#
# 推荐方式：使用 config/ 目录下的分片配置文件，便于分类管理和安全隔离。
# 也可以继续使用本文件的扁平格式，系统会自动向后兼容。
#
# 分片配置文件说明：
#   config/database.yaml  - 数据库连接参数
#   config/secrets.yaml   - JWT密钥、第三方API密钥（⚠️ 勿提交到Git）
#   config/app.yaml       - 应用运行环境配置
#   config/logging.yaml   - 日志记录设置
#   config/cache.yaml     - 缓存配置参数

# ==================== 新版嵌套格式示例 ====================

# 数据库配置（PostgreSQL 数据库）
database:
  # host: 127.0.0.1
  # port: 5432
  # user: postgres
  # password: your_password_here
  # dbname: vcine
  # sslmode: disable
  # timezone: Asia/Shanghai
  # 通用连接池
  # max_open_conns: 25
  # max_idle_conns: 10
  # conn_max_lifetime: 1800

# 敏感信息（建议迁移到 config/secrets.yaml）
secrets:
  jwt_secret: please-change-this-secret-key
  tmdb_api_key: ""

  # API / 图片反向代理 Base URL，不是 curl -x 类型的 forward proxy。
  # 程序会分别自动拼接 /3/... 与 /t/p/...
  tmdb_api_proxy: ""
  tmdb_image_proxy: ""

  # HTTP/SOCKS 网络出口代理，适合 Clash / v2ray / Shadowsocks / Karing。
  # 支持：http://、https://、socks5://、socks5h://
  # 示例：http://192.168.1.11:7890 或 socks5://127.0.0.1:7891
  tmdb_network_proxy: ""

# 应用配置
app:
  port: 8080
  debug: false
  env: production
  data_dir: ./data
  web_dir: ./web/dist
  ffmpeg_path: ffmpeg
  ffprobe_path: ffprobe
  vaapi_device: /dev/dri/renderD128   # Linux Intel 核显逗生门，普通用户无需修改
  cors_origins: []

# ==================== 转码调度 / HLS ABR / 节流 / GPU 安全 ====================
# 【最佳性能策略】所有转码相关行为均为内建自适应，无需任何配置：
#   - 硬件加速：启动时自动检测 NVENC / QSV / VAAPI，都不可用则回落 CPU。
#   - 并发转码：worker 数量固定为 NumCPU/2，保留一半核心给系统和播放。
#   - FFmpeg 线程：-threads 0（FFmpeg 自探测，用满所有 CPU 核心）。
#   - 编码预设：固定 ultrafast（速度优先，硬件编码有其自身的自适应 tune）。
#   - ABR：前端请求 master.m3u8 时并行预转码所有可用档位，hls.js 根据实时带宽切换。
#   - 节流：转码前沿领先播放 > 60s 时挂起 FFmpeg，< 15s 时唤醒。
#   - GPU 安全限流：默认启用，阈值 85%/80℃ 触发降级，60%/70℃ 恢复。

# 日志配置
logging:
  level: info
  format: console
  output_path: ""
  error_output_path: ""
  enable_rotation: false
  max_size_mb: 100
  max_age_days: 30
  max_backups: 10

# 缓存配置
cache:
  cache_dir: ./cache
  max_disk_usage_mb: 0
  ttl_hours: 0
  auto_cleanup: false
  cleanup_interval_min: 60

# ==================== AI 与 Embedding ====================
# embedding 后端（地址即开关，留空 / 注释掉即禁用）：
# 后端：V-Router → ML Server（模型带 ml-server/ 来源前缀即自动走 v-router 协议）
#   api_base: http://v-router:8080/v1
#   model: ml-server/ViT-B-16-SigLIP2__webli
#   api_key: ""   # 可选：REQUIRE_KEY 开启且无 VOS 登录态时填网关 Key
ai:
  embedding_ai:
    api_base: ""
    model: ""
    api_key: ""

# ==================== 视频分析（场景检测与结构化）====================
# 默认关闭。Scene 和 Structure 通过媒体源地址从 nowen-video 拉取媒体流，
# 不再依赖宿主路径映射，也不需要两侧共享文件系统。
video_analysis:
  enabled: false
  scene_base_url: http://scene-detection:8910
  structure_base_url: http://structure:8911
  # detect/structure 回源拉流的媒体源地址不在配置文件中设置：
  # 默认 http://nowen-video:8080（compose 网络别名，自托管同网络部署自动解析）；
  # vos 部署由 compose 自动注入 VCINE_VIDEO_ANALYSIS_MEDIA_BASE_URL，异机/异网拓扑改该 env 后重启
  # 可选内部媒体源令牌；留空表示仅依赖内网隔离
  source_token: ""
  # 远程视频（webdav/alist/s3）结构化分析：默认关闭，开启后会消耗带宽且较慢
  remote_video_enabled: false
  # V-Cine 自己的结构化产物数据目录（默认跟随 cache_dir/structure，一般无需配置）
  max_concurrent: 2
  poll_interval_seconds: 2
  job_timeout_minutes: 120
  describe_enabled: true

# ==================== Emby / Jellyfin 兼容层配置 ====================
# 用于移动端 Emby/Infuse/Jellyfin 客户端登录与播放。无需客户端额外配置，
# 将手机客户端的"服务器地址"填为 http://<server-ip>:8080 即可登录。
emby:
  # 对外显示的服务器名称（留空则使用主机名）
  server_name: ""
  # 是否启用 UDP 7359 局域网服务器自动发现（Emby/Jellyfin 标准协议）
  # 开启后同网段的手机客户端在"添加服务器"时会自动发现本机，无需手动输入 IP
  enable_auto_discovery: true
  # 自动发现监听端口（标准 7359，一般无需修改）
  auto_discovery_port: 7359
  # 是否在登录页公开用户列表（true=显示用户头像可点击登录；false=必须手动输入用户名）
  public_user_list_enabled: false
  # 是否启用 WebSocket 长连接（消除客户端连接失败告警）
  enable_websocket: true
  # 登录页免责声明（Jellyfin 客户端会在登录页展示此文字）
  login_disclaimer: ""
  # 自定义 CSS（仅 Jellyfin Web 客户端使用）
  custom_css: ""

# ==================== 内部可观测性（/metrics + pprof）====================
# 独立内部端口，默认仅绑定 localhost，不挂主路由，无需配置即可用。
# 容器内抓取：需同时覆盖 VCINE_OBSERVABILITY_METRICS_ADDR=0.0.0.0:9090
# 并在 docker-compose 里加端口映射（二者缺一不可）。
observability:
  # 内部服务器监听地址（默认 127.0.0.1:9090）
  metrics_addr: "127.0.0.1:9090"
  # pprof 启动默认值（默认 true，生产可诊断开箱即用）；运行期可用 admin 端点不重启切换：
  # PUT /api/admin/settings/observability/pprof {"enabled": false}
  pprof_enabled: true

# ==================== 旧版扁平格式（向后兼容）====================
# 如果你使用旧版格式，以下 key 仍然有效：
#
# port: 8080
# debug: false
# data_dir: ./data
# cache_dir: ./cache
# web_dir: ./web/dist
# jwt_secret: please-change-this-secret-key
# ffmpeg_path: ffmpeg
# ffprobe_path: ffprobe
# vaapi_device: /dev/dri/renderD128
# tmdb_api_key: ""
name: CI

on:
  pull_request:
    paths:
      - web/package.json
      - web/bun.lock
  push:
    branches: [main]
    paths:
      - web/package.json
      - web/bun.lock

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bun-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Check bun lockfile is up-to-date
        run: cd web && bun install --frozen-lockfile

# ============================================================
# nowen-video 开发覆盖（容器内 go run，免重建镜像）
# 叠加在主 compose 之上，用法：
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   （make dev 已配置为叠加加载）
#
# 说明：
#   - override 同名服务 nowen-video：镜像改用 golang:1.25-alpine，
#     挂载项目源码到 /app，容器内 `go run ./cmd/server` 直接编译运行当前代码。
#   - 改代码后重启容器即生效，无需 docker build 重建镜像。
#   - 端口 override 为 38080:38080：go run 读 config/app.yaml 的 port（38080）。
#   - 卷/环境继承主 compose；仅追加 GOPROXY（golang 镜像默认走 proxy.golang.org 会超时）。
#   - 运行时依赖（ffmpeg/python）未内置：纯后端调试可用；若需转码/刮削，
#     在 golang 镜像基础上叠加依赖（见 Dockerfile 运行阶段依赖列表）。
# ============================================================
version: "3.8"

services:
  nowen-video:
    # 重置主 compose 的 build，避免 up 时触发镜像构建
    build: !reset null
    image: golang:1.25-alpine
    working_dir: /app
    entrypoint: ["sh", "-c", "cd /app && go mod download && go run -ldflags \"-s -w\" ./cmd/server"]
    # go run 读 config/app.yaml 的 port（38080），reset 主 compose 的 38080:8080
    ports: !reset null
    ports:
      - "38080:38080"
    volumes:
      # 挂载整个项目根（源码 + go.mod + web + scripts），覆盖镜像里的二进制
      - ..:/app
      - /data/xjx/workspace/data/video:/data/xjx/workspace/data/video:ro
    environment:
      # Go 模块代理：与 Dockerfile 一致走国内镜像，避免 proxy.golang.org 超时
      - GOPROXY=https://goproxy.cn,https://goproxy.io,direct
    # go run 监听 38080，override 主 compose 的 8080 healthcheck
    healthcheck: !reset null
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:38080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

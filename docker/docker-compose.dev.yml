# ============================================================
# nowen-video 开发覆盖（容器内 go run，免重建镜像）。
# 用法：make dev（自动构建 dev 镜像，首次稍慢）。
# 要点：
#   - 源码挂载到 /app，改代码后 make dev 重启即生效
#   - ffmpeg 烧进镜像层、Go 缓存走命名卷 → 容器重建（down/up）不重装、不重下
# ============================================================
version: "3.8"

services:
  nowen-video:
    # dev 镜像（ffmpeg 在镜像层）见 docker/Dockerfile.dev；up 时缺镜像自动构建
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
      # 故意不声明 ALPINE_MIRROR build-arg：空值会顶掉 Dockerfile.dev 的 ARG 默认；换源用 --build-arg
    image: ${DEV_IMAGE:-nowen-video-dev}
    working_dir: /app
    entrypoint: ["sh", "/app/scripts/dev-entrypoint.sh"]
    ports: !reset null
    ports:
      # 容器内 air 监听 38080（config/app.yaml）；宿主端口与 base 共用 NOWEN_PORT
      - "${NOWEN_PORT:-38080}:38080"
    volumes:
      # 源码热更新（覆盖镜像里的二进制）
      - ..:/app
      - /data/xjx/workspace/data/video:/data/xjx/workspace/data/video:ro
      # Go 模块/编译缓存持久化，重建后增量
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    environment:
      # Go 国内代理（proxy.golang.org 超时）
      - GOPROXY=https://goproxy.cn,https://goproxy.io,direct
      # 容器内挂载宿主 git 仓库时，禁用 Go VCS 印章，避免 git dubious ownership 导致 build 失败
      - GOFLAGS=-buildvcs=false
      # 与上方命名卷路径对齐
      - GOMODCACHE=/go/pkg/mod
      - GOCACHE=/root/.cache/go-build
    healthcheck: !reset null
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:38080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  go-mod-cache:
  go-build-cache:

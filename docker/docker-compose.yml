# ============================================================
# nowen-video Docker Compose
# 用法：
#   docker compose --env-file .env.dev  up -d   # 开发
#   docker compose --env-file .env.prod up -d   # 生产
#   docker compose              up -d            # 默认（.env）
#
# 要点：
#   - config/ + config.yaml 是唯一事实源（端口/AI/DB/日志级别都由它们决定）
#   - env 只能覆盖 config 文件里没写/为空的字段（如 video_analysis 开关、
#     adult_scraper 开关、JWT secret）；写在 config/*.yaml 里的值会覆盖 env
#   - 容器内 WORKDIR=/app，相对路径 data_dir=./data 等解析为 /app/data
# ============================================================
version: "3.8"

services:
  nowen-video:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      # 故意不声明 UBUNTU_MIRROR build-arg（空值会顶掉 Dockerfile 的 ARG 默认）；换源用 --build-arg UBUNTU_MIRROR=...
      # 多架构构建（buildx 时生效）
      # platforms:
      #   - linux/amd64
      #   - linux/arm64
    # 构建产物镜像名（带 registry URL，make build 后打 BUILD_TAG 版本 tag，见 Makefile）
    # 如需本地纯镜像名，把 IMAGE_URL 改成 nowen-video（Makefile 里同步）
    image: ${IMAGE_URL:-nowen-video}:latest
    # 或直接拉远程镜像（生产拉取）：
    # image: swr.cn-southwest-2.myhuaweicloud.com/ictrek/nowen-video:latest
    container_name: nowen-video

    # NAS 上以 root 运行，规避挂载目录权限问题
    user: "0:0"
    privileged: true
    cap_add:
      - SYS_ADMIN   # WebDAV/Alist 挂载
      - NET_ADMIN
      - SYS_PTRACE
      - DAC_READ_SEARCH
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined

    # 容器内 nowen 监听 8080（Dockerfile NOWEN_APP_PORT=8080），
    # 宿主侧暴露端口由 NOWEN_PORT 控制（默认 38080）；dev 覆盖为 ${NOWEN_PORT}:38080。
    ports:
      - "${NOWEN_PORT:-38080}:8080"

    volumes:
      # 应用数据 / 转码缓存（对应 data_dir=./data、cache_dir=./cache，即 /app 下）
      - ../data:/app/data
      - ../cache:/app/cache
      # 原生视频只读挂载（Nowen 读取并传给结构化）。
      # 原生视频目录（raw_dir）必须是只读的，避免 Nowen 误删/误改原始视频。
      # 注意：不能挂 /data:/data:ro —— docker 27 无法在只读 /data 下创建
      # 媒体子目录挂载点（read-only file system），故只挂具体媒体目录。
      - /data/nowen-video-raw:/data/nowen-video-raw:ro
      # 结构化产物改为 HTTP artifact 拉取（v2 Pull），Nowen 不再挂载服务端 staging 卷
      # 结构化产物持久目录默认在 /app/cache/structure（由 cache_dir 决定，无需单独挂载）
      # 配置必须持久化（含 .master.key，丢了解不开 ENC 密钥）
      - ../config:/app/config
      - ../config.yaml:/app/config.yaml

    # 硬件加速：Intel/AMD/ARM 使用 DRM；NVIDIA 使用 Compose GPU reservation。
    devices:
      - /dev/dri:/dev/dri
      - /dev/fuse:/dev/fuse

    environment:
      # NVIDIA Container Toolkit 可用时，自动注入驱动库与 /dev/nvidia*。
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-compute,video,utility}
      # 容器进程用户（配合上方 user）
      - PUID=0
      - PGID=0
      - UMASK=000
      - TZ=Asia/Shanghai
      # Debug 开关 → 日志级别：false=info（默认/生产），true=debug（开发）
      # .env.dev 设 NOWEN_DEBUG=true，.env.prod 不设（走默认 false=info）
      - NOWEN_DEBUG=${NOWEN_DEBUG:-false}
      # 番号刮削（config.yaml 已含，这里仅兜底；enabled 可用 env 切）
      - NOWEN_ADULT_SCRAPER_ENABLED=${NOWEN_ADULT_SCRAPER_ENABLED:-false}
      - NOWEN_ADULT_SCRAPER_AUTO_START_PYTHON=true
      - NOWEN_ADULT_SCRAPER_PYTHON_EXECUTABLE=/usr/bin/python3
      - NOWEN_ADULT_SCRAPER_PYTHON_SERVICE_DIR=/app/scripts/adult-scraper
      # 视频分析开关（config.yaml 已 enabled=true，可经 env 关）
      - NOWEN_VIDEO_ANALYSIS_ENABLED=${NOWEN_VIDEO_ANALYSIS_ENABLED:-true}
      # 媒体源地址：scene/structure 跑在宿主侧，经 docker0 网关 + 宿主端口回源
      # （端口与上方 ports 映射共用 NOWEN_PORT）；代码默认 http://nowen-video:8080 仅同网络容器可解析
      - NOWEN_VIDEO_ANALYSIS_MEDIA_BASE_URL=${NOWEN_VIDEO_ANALYSIS_MEDIA_BASE_URL:-http://172.17.0.1:${NOWEN_PORT:-38080}}
      # JWT Secret 留空则自动生成并持久化到 /app/data/.jwt_secret（重启不失效）
      - NOWEN_SECRETS_JWT_SECRET=${NOWEN_SECRETS_JWT_SECRET:-}

    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]


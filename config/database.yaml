# ==================== 数据库配置 ====================
# 文件: config/database.yaml
# 说明: PostgreSQL 数据库连接参数配置
# 提示: 修改后需重启服务生效

# 数据库主机地址
# 默认: 127.0.0.1
host: 10.144.144.232

# 数据库端口
# 默认: 5432
port: 35432

# 数据库用户名
# 默认: postgres
user: postgres

# 数据库密码
password: postgres

# 数据库名称
# 默认: nowen_video
dbname: nowen_video

# SSL 模式: disable / require / verify-ca / verify-full
# 默认: disable
sslmode: disable

# 时区
# 默认: Asia/Shanghai
timezone: Asia/Shanghai

# 最大打开连接数
# 默认: 25
max_open_conns: 25

# 最大空闲连接数
# 默认: 10
max_idle_conns: 10

# 连接最大存活时间（秒）
# 默认: 1800（30分钟）
conn_max_lifetime: 1800
# ==================== 数据库配置 ====================
# 文件: config/database.yaml
# 说明: 数据库连接参数配置，支持 SQLite 和 PostgreSQL 双驱动
# 提示: 修改后需重启服务生效

# 数据库驱动: sqlite / postgresql
# 默认: sqlite
driver: sqlite

# ==================== SQLite 专属配置 ====================
# 以下配置仅在 driver=sqlite 时生效

# 数据库文件路径
# 相对路径将基于 app.data_dir 解析
# 默认: ./data/nowen.db
db_path: ./data/nowen.db

# 是否启用 WAL (Write-Ahead Logging) 模式
# WAL 模式提供更好的并发读写性能，强烈建议保持开启
# 默认: true
wal_mode: true

# SQLite 繁忙超时（毫秒）
# 当数据库被锁定时，等待释放的最大时间
# 默认: 5000
busy_timeout: 5000

# SQLite 页面缓存大小
# 负数表示以 KB 为单位（如 -20000 表示 ~20MB 缓存）
# 正数表示页面数量
# 默认: -20000
cache_size: -20000

# ==================== PostgreSQL 专属配置 ====================
# 以下配置仅在 driver=postgresql 时生效

# 数据库主机地址
# 默认: 127.0.0.1
# host: 127.0.0.1

# 数据库端口
# 默认: 5432
# port: 5432

# 数据库用户名
# 默认: postgres
# user: postgres

# 数据库密码
# password: your_password_here

# 数据库名称
# 默认: nowen_video
# dbname: nowen_video

# SSL 模式: disable / require / verify-ca / verify-full
# 默认: disable
# sslmode: disable

# 时区
# 默认: Asia/Shanghai
# timezone: Asia/Shanghai

# ==================== 通用连接池配置 ====================
# 按 driver 取不同默认值（SQLite: 1/1, PostgreSQL: 25/10/1800s）
# 设置为 0 时使用驱动默认值

# 最大打开连接数
# SQLite 默认: 1, PostgreSQL 默认: 25
max_open_conns: 1

# 最大空闲连接数
# SQLite 默认: 1, PostgreSQL 默认: 10
max_idle_conns: 1

# 连接最大存活时间（秒）
# SQLite 默认: 0（不限）, PostgreSQL 默认: 1800（30分钟）
# conn_max_lifetime: 1800
